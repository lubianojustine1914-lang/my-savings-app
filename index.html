<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>My Savings - Personal Savings App</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>

  <!-- iPhone Frame -->
  <div class="iphone-frame">
    <!-- Dynamic Island -->
    <div class="dynamic-island">
      <div class="camera-lens"></div>
    </div>

    <!-- Screen Content Container -->
    <div class="screen-content">
      
      <!-- iOS Status Bar -->
      <div class="status-bar">
        <span class="time" id="clock">09:41</span>
        <div class="status-icons">
          <span class="icon">5G</span>
          <span class="icon">📶</span>
          <span class="icon">🔋</span>
        </div>
      </div>

      <!-- AUTH PAGE (LOGIN & REGISTER) -->
      <div class="card" id="auth-screen">
        <div class="app-logo">💰</div>
        <h2 id="form-title">My Savings</h2>
        <p class="subtitle">Log in or create an account to start</p>
        
        <input type="email" id="email" placeholder="Email Address">
        <input type="password" id="password" placeholder="Password">
        
        <button id="btn-login" class="btn-primary">Log In</button>
        <button id="btn-signup" class="btn-secondary">Create Account</button>
      </div>

      <!-- MAIN APP DASHBOARD (HIDDEN BY DEFAULT) -->
      <div class="card hidden" id="dashboard-screen">
        <h2>My Savings</h2>
        <p class="subtitle">Current Savings Balance</p>
        <div class="balance-display" id="balance-amount">₱0.00</div>
        
        <input type="number" id="amount" placeholder="Enter amount (₱)">
        
        <div class="action-buttons">
          <button id="btn-deposit" class="btn-primary">Deposit</button>
          <button id="btn-withdraw" class="btn-secondary">Withdraw</button>
        </div>

        <button id="btn-logout" class="btn-danger">Log Out</button>
      </div>

    </div>

    <!-- Home Indicator -->
    <div class="home-indicator"></div>
  </div>

  <!-- FIREBASE SDK INTEGRATION -->
  <script type="module">
    import { initializeApp } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-app.js";
    import { getAuth, createUserWithEmailAndPassword, signInWithEmailAndPassword, signOut, onAuthStateChanged } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-auth.js";

    const firebaseConfig = {
      apiKey: "AIzaSyD_AvR_m3yCN1H0_pIyEr2jPzENitojClk",
      authDomain: "my-savings-app-5c943.firebaseapp.com",
      projectId: "my-savings-app-5c943",
      storageBucket: "my-savings-app-5c943.firebasestorage.app",
      messagingSenderId: "1003666388145",
      appId: "1:1003666388145:web:86fad87943887695f8de98",
      measurementId: "G-W0BMH4DCBS"
    };

    const app = initializeApp(firebaseConfig);
    const auth = getAuth(app);

    let savings = 0;

    const authScreen = document.getElementById('auth-screen');
    const dashboardScreen = document.getElementById('dashboard-screen');
    const emailInput = document.getElementById('email');
    const passwordInput = document.getElementById('password');
    const balanceAmount = document.getElementById('balance-amount');

    // Monitor Login Status
    onAuthStateChanged(auth, (user) => {
      if (user) {
        authScreen.classList.add('hidden');
        dashboardScreen.classList.remove('hidden');
      } else {
        authScreen.classList.remove('hidden');
        dashboardScreen.classList.add('hidden');
      }
    });

    // Create Account
    document.getElementById('btn-signup').addEventListener('click', () => {
      if(!emailInput.value || !passwordInput.value) {
        alert("Pakilagay ang email at password.");
        return;
      }
      createUserWithEmailAndPassword(auth, emailInput.value, passwordInput.value)
        .then(() => alert("Account created successfully!"))
        .catch((error) => alert(error.message));
    });

    // Log In
    document.getElementById('btn-login').addEventListener('click', () => {
      signInWithEmailAndPassword(auth, emailInput.value, passwordInput.value)
        .catch((error) => alert(error.message));
    });

    // Log Out
    document.getElementById('btn-logout').addEventListener('click', () => {
      signOut(auth);
    });

    // Deposit & Withdraw
    document.getElementById('btn-deposit').addEventListener('click', () => {
      const val = parseFloat(document.getElementById('amount').value);
      if (!isNaN(val) && val > 0) {
        savings += val;
        balanceAmount.textContent = `₱${savings.toFixed(2)}`;
        document.getElementById('amount').value = '';
      }
    });

    document.getElementById('btn-withdraw').addEventListener('click', () => {
      const val = parseFloat(document.getElementById('amount').value);
      if (!isNaN(val) && val > 0 && val <= savings) {
        savings -= val;
        balanceAmount.textContent = `₱${savings.toFixed(2)}`;
        document.getElementById('amount').value = '';
      }
    });
  </script>
</body>
</html>
